services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra-db
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10

  streamlit:
    build: .
    container_name: cassandra-app
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "8501:8501"